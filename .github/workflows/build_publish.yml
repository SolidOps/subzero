name: Build & Publish

on:
  workflow_dispatch:  
  push:
    branches: [ "main" ]

env:
  PROJECT_PATH: src/SubZero.slnx
  PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output

jobs:
  Build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore src/SubZero.slnx
      - name: Build
        run: dotnet build --no-restore src/SubZero.slnx
      - name: Test 
        run: dotnet test --no-build --verbosity normal src/SubZero.slnx            
      - name: Semantic Release Setup
        id: release-setup
        run: echo '{"branches":["main"],"plugins":["@semantic-release/commit-analyzer", "@semantic-release/release-notes-generator", "@semantic-release/github"]}' > .releaserc.json
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: NuGet login
        if: steps.semantic.outputs.new_release_published == 'true'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet package
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          dotnet clean src/SubZero/SubZero.csproj
          dotnet pack -p:PackageVersion=${{ steps.semantic.outputs.new_release_version }} --configuration Release src/SubZero/SubZero.csproj 
          dotnet nuget push src/SubZero/**/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json


